name: Build RecoilComp

on:
  push:
    branches: [ main, master ]

jobs:
  build-usermode:
    name: Usermode
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile
        shell: cmd
        run: |
          cd usermode
          cl.exe /std:c++17 /EHsc /O2 /W3 /MT ^
            /DUNICODE /D_UNICODE /DWIN32_LEAN_AND_MEAN /DNOMINMAX ^
            main.cpp recoil.cpp logger.cpp profile.cpp overlay.cpp ^
            /Fe:RecoilComp.exe ^
            /link /SUBSYSTEM:WINDOWS ^
            user32.lib shell32.lib kernel32.lib advapi32.lib gdi32.lib

      - uses: actions/upload-artifact@v4
        with:
          name: RecoilComp-usermode
          path: usermode\RecoilComp.exe

  build-driver:
    name: Driver
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install WDK via NuGet
        shell: powershell
        run: |
          Write-Host "[*] Installing WDK NuGet packages..."
          nuget install Microsoft.Windows.WDK.x64      -OutputDirectory C:\wdk -NonInteractive
          nuget install Microsoft.Windows.SDK.CPP      -OutputDirectory C:\wdk -NonInteractive
          nuget install Microsoft.Windows.SDK.CPP.x64  -OutputDirectory C:\wdk -NonInteractive

          $wdkPkg = Get-ChildItem "C:\wdk" -Filter "Microsoft.Windows.WDK.x64.*" |
            Sort-Object Name -Descending | Select-Object -First 1
          $sdkPkg = Get-ChildItem "C:\wdk" -Filter "Microsoft.Windows.SDK.CPP.*" |
            Where-Object { $_.Name -notlike "*x64*" } |
            Sort-Object Name -Descending | Select-Object -First 1

          Write-Host "[*] WDK package: $($wdkPkg.Name)"
          Write-Host "[*] SDK package: $($sdkPkg.Name)"

          $ntddk = Join-Path $wdkPkg.FullName "c\km\ntddk.h"
          Write-Host "[check] ntddk.h: $(Test-Path $ntddk)"

          # Сохраняем пути для следующего шага
          Add-Content $env:GITHUB_ENV "WDK_KM_INC=$($wdkPkg.FullName)\c\km"
          Add-Content $env:GITHUB_ENV "WDK_SH_INC=$($sdkPkg.FullName)\c\shared"
          Add-Content $env:GITHUB_ENV "WDK_KM_LIB=$($wdkPkg.FullName)\lib\km\x64"

      - name: Build driver
        shell: cmd
        run: |
          echo [*] KM include: %WDK_KM_INC%
          echo [*] Shared:     %WDK_SH_INC%
          echo [*] KM lib:     %WDK_KM_LIB%

          md bin\Release 2>nul
          cd driver

          cl.exe /kernel /c /GS- /Gz /W3 /O2 /EHa- /Zl ^
            /I "%WDK_KM_INC%" ^
            /I "%WDK_SH_INC%" ^
            /I "..\usermode" ^
            /D_AMD64_ /DNDEBUG ^
            driver.c evasion.c mouse_filter.c
          if %errorlevel% neq 0 exit /b %errorlevel%

          link.exe /NODEFAULTLIB /SUBSYSTEM:NATIVE /DRIVER:WDM ^
            /ENTRY:DriverEntry ^
            /OUT:..\bin\Release\recoil.sys ^
            /LIBPATH:"%WDK_KM_LIB%" ^
            ntoskrnl.lib hal.lib wdm.lib wdmsec.lib kbdmou.lib ^
            driver.obj evasion.obj mouse_filter.obj

      - uses: actions/upload-artifact@v4
        with:
          name: RecoilDriver-sys
          path: |
            bin\Release\recoil.sys
            driver\install.bat
            driver\uninstall.bat
            driver\driver.inf

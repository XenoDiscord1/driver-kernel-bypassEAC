name: Build RecoilComp

on:
  push:
    branches: [ main, master ]

jobs:
  build-usermode:
    name: Usermode
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile
        shell: cmd
        run: |
          cd usermode
          cl.exe /std:c++17 /EHsc /O2 /W3 /MT ^
            /DUNICODE /D_UNICODE /DWIN32_LEAN_AND_MEAN /DNOMINMAX ^
            /FI"winioctl.h" ^
            main.cpp recoil.cpp logger.cpp profile.cpp overlay.cpp ^
            /Fe:RecoilComp.exe ^
            /link /SUBSYSTEM:WINDOWS ^
            user32.lib shell32.lib kernel32.lib advapi32.lib gdi32.lib

      - uses: actions/upload-artifact@v4
        with:
          name: RecoilComp-usermode
          path: usermode\RecoilComp.exe

  build-driver:
    name: Driver
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install WDK
        shell: powershell
        run: |
          $VS = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"

          Write-Host "[*] Downloading SDK..."
          $sdk = "$env:TEMP\sdksetup.exe"
          Invoke-WebRequest "https://go.microsoft.com/fwlink/?linkid=2272610" `
            -OutFile $sdk -UseBasicParsing
          Write-Host "[*] Installing SDK..."
          Start-Process $sdk `
            -ArgumentList "/features + /q /norestart /ceip off" `
            -Wait -NoNewWindow

          Write-Host "[*] Downloading WDK..."
          $wdk = "$env:TEMP\wdksetup.exe"
          Invoke-WebRequest "https://go.microsoft.com/fwlink/?linkid=2249371" `
            -OutFile $wdk -UseBasicParsing
          Write-Host "[*] Installing WDK..."
          Start-Process $wdk `
            -ArgumentList "/features + /q /norestart /ceip off /vsPath `"$VS`"" `
            -Wait -NoNewWindow

          # Установить VSIX вручную если props не появился
          $props = "C:\Program Files (x86)\Windows Kits\10\build\WindowsDriver.Default.props"
          if (-not (Test-Path $props)) {
            Write-Host "[*] Props not found, trying VSIX install..."
            $vsix = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10" `
              -Recurse -Filter "*.vsix" | Select-Object -First 1
            if ($vsix) {
              $vsixInstaller = "$VS\Common7\IDE\VSIXInstaller.exe"
              Start-Process $vsixInstaller `
                -ArgumentList "/quiet /force `"$($vsix.FullName)`"" `
                -Wait -NoNewWindow
            } else {
              Write-Host "[!] No VSIX found"
            }
          }
          Write-Host "[check] Props exists: $(Test-Path $props)"

      - name: Build driver
        shell: cmd
        run: |
          for /f "delims=" %%v in ('dir /b /ad "C:\Program Files (x86)\Windows Kits\10\Include\" ^| findstr /r "^10\." ^| sort /r') do (
            set "WDKVER=%%v"
            goto :found
          )
          :found
          echo [*] WDK version: %WDKVER%

          set KM_INC=C:\Program Files (x86)\Windows Kits\10\Include\%WDKVER%\km
          set SH_INC=C:\Program Files (x86)\Windows Kits\10\Include\%WDKVER%\shared
          set KM_LIB=C:\Program Files (x86)\Windows Kits\10\Lib\%WDKVER%\km\x64

          md bin\Release 2>nul

          cd driver
          cl.exe /kernel /c /GS- /Gz /W3 /O2 /EHa- /nodefaultlib /Zl ^
            /I "%KM_INC%" /I "%SH_INC%" /I "..\usermode" ^
            /D_AMD64_ /DNDEBUG /D_KERNEL_MODE ^
            driver.c evasion.c mouse_filter.c
          if %errorlevel% neq 0 exit /b %errorlevel%

          link.exe /NODEFAULTLIB /SUBSYSTEM:NATIVE /DRIVER:WDM ^
            /ENTRY:DriverEntry /OUT:..\bin\Release\recoil.sys ^
            /LIBPATH:"%KM_LIB%" ^
            ntoskrnl.lib hal.lib wdm.lib wdmsec.lib kbdmou.lib ^
            driver.obj evasion.obj mouse_filter.obj

      - uses: actions/upload-artifact@v4
        with:
          name: RecoilDriver-sys
          path: |
            bin\Release\recoil.sys
            driver\install.bat
            driver\uninstall.bat
            driver\driver.inf

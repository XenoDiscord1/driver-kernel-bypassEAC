name: Build RecoilComp

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # USERMODE — Ninja + MSVC (не требует полного VS, работает на любом раннере)
  # ───────────────────────────────────────────────────────────────────────────
  build-usermode:
    name: Usermode (CMake + Ninja)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Поднимает окружение MSVC: cl.exe / link.exe попадают в PATH,
      # INCLUDE и LIB выставляются автоматически — аналог vcvarsall.bat x64
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake (Ninja, cl.exe)
        working-directory: usermode
        run: |
          cmake -B build ^
            -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_C_COMPILER=cl ^
            -DCMAKE_CXX_COMPILER=cl

      - name: Build
        working-directory: usermode
        run: cmake --build build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecoilComp-usermode
          path: usermode/build/RecoilComp.exe

  # ───────────────────────────────────────────────────────────────────────────
  # DRIVER — WDK через NuGet (надёжнее offline installer) + cl.exe напрямую
  # ───────────────────────────────────────────────────────────────────────────
  build-driver:
    name: Kernel Driver (WDK NuGet + cl.exe)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # cl.exe / link.exe в PATH, INCLUDE / LIB для MSVC выставлены
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # WDK через NuGet — официальный путь для CI без GUI-установщика.
      # nuget.exe pre-installed на windows-latest раннерах.
      # Пакеты: WDK.x64 (km headers + km libs) + SDK.CPP (shared/um headers)
      - name: Install WDK NuGet packages
        run: |
          nuget install Microsoft.Windows.WDK.x64      -OutputDirectory C:\wdk -NonInteractive -Verbosity quiet
          nuget install Microsoft.Windows.SDK.CPP       -OutputDirectory C:\wdk -NonInteractive -Verbosity quiet
          nuget install Microsoft.Windows.SDK.CPP.x64  -OutputDirectory C:\wdk -NonInteractive -Verbosity quiet

      - name: Build kernel driver
        shell: pwsh
        run: |
          # ── Находим папки пакетов (версия в имени, не хардкодим) ──────────
          $wdkPkg = Get-ChildItem "C:\wdk" -Filter "Microsoft.Windows.WDK.x64.*" -Directory |
                    Sort-Object Name -Descending | Select-Object -First 1
          $sdkPkg = Get-ChildItem "C:\wdk" -Filter "Microsoft.Windows.SDK.CPP.*" -Directory |
                    Where-Object { $_.Name -notmatch "x64" } |
                    Sort-Object Name -Descending | Select-Object -First 1

          if (-not $wdkPkg) { Write-Error "WDK package not found in C:\wdk"; exit 1 }
          if (-not $sdkPkg) { Write-Error "SDK.CPP package not found in C:\wdk"; exit 1 }

          $wdkRoot = $wdkPkg.FullName
          $sdkRoot = $sdkPkg.FullName

          $kmInc  = "$wdkRoot\c\km"
          $shInc  = "$sdkRoot\c\shared"
          $umInc  = "$sdkRoot\c\um"
          $kmLib  = "$wdkRoot\lib\km\x64"

          Write-Host "[*] WDK : $wdkRoot"
          Write-Host "[*] SDK : $sdkRoot"
          Write-Host "[*] kmInc: $kmInc"
          Write-Host "[*] kmLib: $kmLib"

          # ── Проверяем ntddk.h ────────────────────────────────────────────
          if (-not (Test-Path "$kmInc\ntddk.h")) {
            Write-Error "ntddk.h NOT FOUND at $kmInc"
            Get-ChildItem $wdkRoot -Recurse -Filter "ntddk.h" | Select-Object FullName
            exit 1
          }
          Write-Host "[OK] ntddk.h found"

          # ── obj папка ────────────────────────────────────────────────────
          New-Item -ItemType Directory -Force -Path driver\obj | Out-Null

          # ── Компилируем каждый .c ────────────────────────────────────────
          $sources = @("driver\driver.c", "driver\evasion.c", "driver\mouse_filter.c")
          foreach ($src in $sources) {
            $obj = "driver\obj\" + [IO.Path]::GetFileNameWithoutExtension($src) + ".obj"
            Write-Host "CC $src -> $obj"

            # ilammy/msvc-dev-cmd уже поставил cl.exe в PATH
            cl.exe /nologo /c `
              /I"$kmInc" /I"$shInc" /I"$umInc" /I"usermode" `
              /kernel /GS- /Gz /GF /Gm- /EHs-c- /MT `
              /W4 /WX- /O2 /Oi `
              /D_KERNEL_MODE /D_AMD64_ /DAMD64 /D_WIN64 /DNDEBUG `
              /Fo"$obj" "$src"

            if ($LASTEXITCODE -ne 0) {
              Write-Error "Compile failed: $src (exit $LASTEXITCODE)"
              exit 1
            }
          }

          # ── Линкуем в .sys ───────────────────────────────────────────────
          $objs = (Get-ChildItem driver\obj\*.obj | ForEach-Object { "`"$($_.FullName)`"" }) -join " "
          Write-Host "LINK -> driver\recoil.sys"

          Invoke-Expression ("link.exe /nologo " +
            "/SUBSYSTEM:NATIVE /DRIVER:WDM /NODEFAULTLIB /ENTRY:DriverEntry " +
            "/LIBPATH:`"$kmLib`" " +
            "ntoskrnl.lib hal.lib wdm.lib wdmsec.lib wmilib.lib BufferOverflowFastFailK.lib " +
            "/OUT:driver\recoil.sys /MAP:driver\recoil.map " +
            $objs)

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Link failed (exit $LASTEXITCODE)"
            exit 1
          }

          $sz = (Get-Item driver\recoil.sys).Length
          Write-Host "[OK] driver\recoil.sys built — $sz bytes"

      - name: Upload driver artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecoilDriver-sys
          path: |
            driver/recoil.sys
            driver/install.bat
            driver/recoil.map

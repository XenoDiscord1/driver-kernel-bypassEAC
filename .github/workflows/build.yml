name: Build RecoilComp

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # USERMODE
  # ilammy/msvc-dev-cmd ставит VS в окружение → cmake автоматически находит
  # VS18 2026 (видно в логах). Ninja не нужен — убираем, оставляем автодетект.
  # ^ в PS не работает как line-continuation (это cmd-синтаксис) — всё в одну строку.
  # ───────────────────────────────────────────────────────────────────────────
  build-usermode:
    name: Usermode (CMake)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        working-directory: usermode
        run: cmake -B build

      - name: Build
        working-directory: usermode
        run: cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecoilComp-usermode
          path: usermode/build/Release/RecoilComp.exe

  # ───────────────────────────────────────────────────────────────────────────
  # DRIVER
  # NuGet-пакет версии 10.0.28000+ имеет другую структуру папок.
  # Вместо хардкода пути — ищем ntddk.h рекурсивно и берём директорию оттуда.
  # ───────────────────────────────────────────────────────────────────────────
  build-driver:
    name: Kernel Driver (WDK NuGet)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install WDK NuGet packages
        run: |
          nuget install Microsoft.Windows.WDK.x64     -OutputDirectory C:\wdk -NonInteractive -Verbosity quiet
          nuget install Microsoft.Windows.SDK.CPP      -OutputDirectory C:\wdk -NonInteractive -Verbosity quiet
          nuget install Microsoft.Windows.SDK.CPP.x64 -OutputDirectory C:\wdk -NonInteractive -Verbosity quiet

      - name: Build kernel driver
        shell: pwsh
        run: |
          # ── Найти ntddk.h рекурсивно — не завязываться на структуру пакета ──
          Write-Host "Searching for ntddk.h under C:\wdk ..."
          $ntddkFile = Get-ChildItem "C:\wdk" -Recurse -Filter "ntddk.h" -ErrorAction SilentlyContinue |
                       Select-Object -First 1
          if (-not $ntddkFile) {
            Write-Host "ntddk.h not found. Package contents:"
            Get-ChildItem "C:\wdk" -Recurse -Depth 4 | Select-Object FullName | Format-Table -AutoSize
            Write-Error "ntddk.h not found — NuGet package layout unexpected"
            exit 1
          }
          $kmInc = $ntddkFile.Directory.FullName
          Write-Host "[OK] kmInc = $kmInc"

          # ── shared/um: найти basetsd.h (shared) и windows.h (um) ──────────
          $basetsd = Get-ChildItem "C:\wdk" -Recurse -Filter "basetsd.h" -ErrorAction SilentlyContinue |
                     Select-Object -First 1
          $windowsh = Get-ChildItem "C:\wdk" -Recurse -Filter "windows.h" -ErrorAction SilentlyContinue |
                      Select-Object -First 1

          $shInc = if ($basetsd)  { $basetsd.Directory.FullName }  else { "" }
          $umInc = if ($windowsh) { $windowsh.Directory.FullName } else { "" }
          Write-Host "[*] shInc = $shInc"
          Write-Host "[*] umInc = $umInc"

          # ── ntoskrnl.lib → km lib path ────────────────────────────────────
          $ntoskrnl = Get-ChildItem "C:\wdk" -Recurse -Filter "ntoskrnl.lib" -ErrorAction SilentlyContinue |
                      Where-Object { $_.FullName -match "\\x64" } |
                      Select-Object -First 1
          if (-not $ntoskrnl) {
            Write-Error "ntoskrnl.lib not found under C:\wdk"
            exit 1
          }
          $kmLib = $ntoskrnl.Directory.FullName
          Write-Host "[OK] kmLib = $kmLib"

          # ── obj folder ────────────────────────────────────────────────────
          New-Item -ItemType Directory -Force -Path driver\obj | Out-Null

          # ── Compile ───────────────────────────────────────────────────────
          $iFlags = @("/I`"$kmInc`"")
          if ($shInc) { $iFlags += "/I`"$shInc`"" }
          if ($umInc) { $iFlags += "/I`"$umInc`"" }
          $iFlags += "/I`"usermode`""

          $sources = @("driver\driver.c", "driver\evasion.c", "driver\mouse_filter.c")
          foreach ($src in $sources) {
            $obj = "driver\obj\" + [IO.Path]::GetFileNameWithoutExtension($src) + ".obj"
            Write-Host "CC  $src"

            $clArgs = @("/nologo", "/c") + $iFlags + @(
              "/kernel", "/GS-", "/Gz", "/GF", "/Gm-", "/EHs-c-", "/MT",
              "/W4", "/WX-", "/O2", "/Oi",
              "/D_KERNEL_MODE", "/D_AMD64_", "/DAMD64", "/D_WIN64", "/DNDEBUG",
              "/Fo`"$obj`"", "`"$src`""
            )
            & cl.exe @clArgs
            if ($LASTEXITCODE -ne 0) { Write-Error "Compile failed: $src"; exit 1 }
          }

          # ── Link ──────────────────────────────────────────────────────────
          Write-Host "LINK driver\recoil.sys"
          $objs = (Get-ChildItem driver\obj\*.obj | ForEach-Object { "`"$($_.FullName)`"" })

          $linkArgs = @(
            "/nologo",
            "/SUBSYSTEM:NATIVE", "/DRIVER:WDM",
            "/NODEFAULTLIB", "/ENTRY:DriverEntry",
            "/LIBPATH:`"$kmLib`"",
            "ntoskrnl.lib", "hal.lib", "wdm.lib", "wdmsec.lib", "wmilib.lib",
            "BufferOverflowFastFailK.lib",
            "/OUT:driver\recoil.sys",
            "/MAP:driver\recoil.map"
          ) + $objs

          & link.exe @linkArgs
          if ($LASTEXITCODE -ne 0) { Write-Error "Link failed"; exit 1 }

          $sz = (Get-Item driver\recoil.sys).Length
          Write-Host "[OK] recoil.sys — $sz bytes"

      - name: Upload driver artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecoilDriver-sys
          path: |
            driver/recoil.sys
            driver/install.bat
            driver/recoil.map

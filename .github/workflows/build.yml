name: Build RecoilComp

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # USERMODE — CMake + MSVC, как у тебя и работало
  # ─────────────────────────────────────────────
  build-usermode:
    name: Usermode (CMake)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        working-directory: usermode
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        working-directory: usermode
        run: cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecoilComp-usermode
          path: usermode/build/Release/RecoilComp.exe

  # ─────────────────────────────────────────────
  # DRIVER — WDK + cl.exe напрямую, без CMake
  # ─────────────────────────────────────────────
  build-driver:
    name: Kernel Driver (WDK)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Ставим WDK через winget — самый надёжный путь в GitHub-hosted runners
      - name: Install WDK
        shell: pwsh
        run: |
          # Качаем WDK offline installer напрямую с Microsoft
          $wdkUrl  = "https://go.microsoft.com/fwlink/?linkid=2249371"   # WDK for Windows 11 24H2
          $sdkUrl  = "https://go.microsoft.com/fwlink/?linkid=2249910"   # SDK matching build
          $wdkInst = "$env:TEMP\wdksetup.exe"
          $sdkInst = "$env:TEMP\winsdksetup.exe"

          Write-Host "Downloading SDK..."
          Invoke-WebRequest -Uri $sdkUrl -OutFile $sdkInst -UseBasicParsing
          Write-Host "Installing SDK (headers + libs only)..."
          Start-Process -Wait -FilePath $sdkInst -ArgumentList `
            "/features OptionId.DesktopCPPx64 /quiet /norestart"

          Write-Host "Downloading WDK..."
          Invoke-WebRequest -Uri $wdkUrl -OutFile $wdkInst -UseBasicParsing
          Write-Host "Installing WDK..."
          Start-Process -Wait -FilePath $wdkInst -ArgumentList "/quiet /norestart"

      # Находим пути и компилируем — INCLUDE передаётся явно через /I
      - name: Find WDK paths and build driver
        shell: pwsh
        run: |
          # ── Ищем MSVC cl.exe ──────────────────────────────────────────
          $vsBase = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC"
          $msvcVer = (Get-ChildItem $vsBase | Sort-Object Name -Descending | Select-Object -First 1).Name
          $cl = "$vsBase\$msvcVer\bin\Hostx64\x64\cl.exe"
          $link = "$vsBase\$msvcVer\bin\Hostx64\x64\link.exe"
          Write-Host "cl.exe  : $cl"
          Write-Host "link.exe: $link"

          # ── Ищем WDK km headers ───────────────────────────────────────
          $wdkBase = "C:\Program Files (x86)\Windows Kits\10"
          $kitsVer = (Get-ChildItem "$wdkBase\Include" | Sort-Object Name -Descending | Select-Object -First 1).Name
          $kmInc  = "$wdkBase\Include\$kitsVer\km"
          $shInc  = "$wdkBase\Include\$kitsVer\shared"
          $ucInc  = "$wdkBase\Include\$kitsVer\um"
          $kmLib  = "$wdkBase\Lib\$kitsVer\km\x64"
          $umLib  = "$wdkBase\Lib\$kitsVer\um\x64"

          # ── MSVC CRT lib ──────────────────────────────────────────────
          $msvcLib = "$vsBase\$msvcVer\lib\x64"

          Write-Host "KM inc : $kmInc"
          Write-Host "Shared : $shInc"
          Write-Host "UM inc : $ucInc"
          Write-Host "KM lib : $kmLib"

          # ── Проверяем ntddk.h ─────────────────────────────────────────
          if (-not (Test-Path "$kmInc\ntddk.h")) {
              Write-Error "ntddk.h NOT FOUND at $kmInc — WDK install failed"
              exit 1
          }
          Write-Host "[OK] ntddk.h found"

          # ── Создаём obj папку ─────────────────────────────────────────
          New-Item -ItemType Directory -Force -Path driver\obj | Out-Null

          # ── Список исходников ─────────────────────────────────────────
          $sources = @("driver\driver.c", "driver\evasion.c", "driver\mouse_filter.c")

          # ── Компилируем каждый .c в .obj ─────────────────────────────
          foreach ($src in $sources) {
              $obj = "driver\obj\" + [System.IO.Path]::GetFileNameWithoutExtension($src) + ".obj"
              Write-Host "Compiling $src -> $obj"
              & $cl `
                /nologo /c `
                /I"$kmInc" /I"$shInc" /I"$ucInc" `
                /kernel /GS- /Gz /GF /Gm- /EHs-c- /MT /W4 /WX- /O2 /Oi `
                /D_KERNEL_MODE /D_AMD64_ /DAMD64 /D_WIN64 /DNDEBUG `
                /D_UNICODE /DUNICODE `
                /Fo"$obj" `
                "$src"
              if ($LASTEXITCODE -ne 0) { Write-Error "Compile failed: $src"; exit 1 }
          }

          # ── Линкуем в .sys ────────────────────────────────────────────
          $objs = (Get-ChildItem driver\obj\*.obj).FullName -join " "
          Write-Host "Linking -> driver\recoil.sys"
          & $link `
            /nologo /SUBSYSTEM:NATIVE /DRIVER:WDM `
            /NODEFAULTLIB /ENTRY:DriverEntry `
            /LIBPATH:"$kmLib" /LIBPATH:"$msvcLib" `
            ntoskrnl.lib hal.lib wdm.lib BufferOverflowFastFailK.lib `
            /OUT:driver\recoil.sys `
            /MAP:driver\recoil.map `
            $objs
          if ($LASTEXITCODE -ne 0) { Write-Error "Link failed"; exit 1 }

          Write-Host "[OK] driver\recoil.sys built successfully"
          $size = (Get-Item driver\recoil.sys).Length
          Write-Host "Size: $size bytes"

      # ── install.bat для ручного теста ─────────────────────────────────
      - name: Generate install.bat
        shell: pwsh
        run: |
          $bat = @'
          @echo off
          :: Запускать от администратора
          set SVC_NAME=RecoilDriver
          set SYS_PATH=%~dp0recoil.sys

          sc stop  %SVC_NAME% >nul 2>&1
          sc delete %SVC_NAME% >nul 2>&1

          sc create %SVC_NAME% type= kernel binPath= "%SYS_PATH%"
          sc start  %SVC_NAME%
          if %errorlevel% neq 0 (
              echo [FAIL] Driver failed to start. Check with: sc query %SVC_NAME%
              echo        Or check Event Viewer - Windows Logs - System
              exit /b 1
          )
          echo [OK] Driver loaded.
          '@
          $bat | Out-File -FilePath driver\install.bat -Encoding ascii

      - name: Upload driver artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecoilDriver-sys
          path: |
            driver/recoil.sys
            driver/install.bat
            driver/recoil.map

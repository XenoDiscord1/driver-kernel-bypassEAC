name: Build RecoilComp

on:
  push:
    branches: [ main, master ]

jobs:
  build-usermode:
    name: Usermode
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v1
      - name: Configure CMake
        run: cmake -S usermode -B build -G "Visual Studio 17 2022" -A x64
        shell: cmd
      - name: Build
        run: cmake --build build --config Release
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: RecoilComp-usermode
          path: build\Release\RecoilComp.exe

  build-driver:
    name: Driver
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v1
      - name: Install WDK
        shell: powershell
        run: |
          $wdk = "$env:TEMP\wdk.exe"
          Invoke-WebRequest "https://go.microsoft.com/fwlink/?linkid=2249371" -OutFile $wdk -UseBasicParsing
          Start-Process $wdk -ArgumentList "/q /norestart" -Wait -NoNewWindow
      - name: Build driver
        shell: cmd
        run: |
          for /f "delims=" %%v in ('dir /b /ad "C:\Program Files (x86)\Windows Kits\10\Include\" ^| sort /r') do (set WDK=%%v & goto found)
          :found
          msbuild driver\RecoilDriver.vcxproj /p:Configuration=Release /p:Platform=x64 /p:LatestTargetPlatformVersion=%WDK% /v:minimal
      - uses: actions/upload-artifact@v4
        with:
          name: RecoilDriver-sys
          path: |
            bin\Release\recoil.sys
            driver\install.bat
            driver\uninstall.bat
